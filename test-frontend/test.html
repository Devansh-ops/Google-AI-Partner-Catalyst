<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Mentor - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .content {
            padding: 30px;
        }
        .status {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .connected {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .section {
            margin-bottom: 30px;
        }
        .section h3 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            font-family: 'Courier New', monospace;
            min-height: 150px;
            resize: vertical;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
            min-width: 150px;
        }
        button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        button.secondary {
            background: #6c757d;
        }
        button.secondary:hover:not(:disabled) {
            background: #5a6268;
        }
        button.success {
            background: #28a745;
        }
        button.success:hover:not(:disabled) {
            background: #218838;
        }
        .hint {
            background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%);
            border-left: 4px solid #ffc107;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .hint h3 {
            color: #856404;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hint p {
            color: #533f03;
            line-height: 1.6;
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .hint pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .hint code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        .hint small {
            color: #856404;
            font-size: 12px;
        }
        .log {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
            word-wrap: break-word;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry.info { color: #0066cc; }
        .log-entry.success { color: #28a745; }
        .log-entry.error { color: #dc3545; }
        .log-entry.warning { color: #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 LeetCode AI Mentor</h1>
            <p>Minimal Test Interface</p>
        </div>

        <div class="content">
            <div id="status" class="status disconnected">
                <span>❌</span>
                <span>Disconnected</span>
            </div>

            <div class="section">
                <h3>🔌 Connection</h3>
                <label>WebSocket URL:</label>
                <input type="text" id="wsUrl" value="ws://localhost:8000/ws/test-session-123" />
                
                <div class="button-group">
                    <button id="connectBtn" class="success" onclick="connect()">Connect</button>
                    <button id="disconnectBtn" class="secondary" onclick="disconnect()" disabled>Disconnect</button>
                </div>
            </div>

            <div class="section">
                <h3>📝 Test Events</h3>

                <label>Problem Title:</label>
                <input type="text" id="problemTitle" value="Two Sum" />

                <label>Your Code:</label>
                <textarea id="code">def twoSum(nums, target):
    for i in range(len(nums)):
        for j in range(i+1, len(nums)):
            if nums[i] + nums[j] == target:
                return [i, j]
    return None</textarea>

                <label>Problem Description:</label>
                <textarea id="problemDescription" style="min-height: 100px;">Given an array of integers nums and an integer target, return indices of the two numbers such that they add up to target. You may assume that each input would have exactly one solution, and you may not use the same element twice.</textarea>

                <label>Test Status (for TEST_RUN):</label>
                <select id="testStatus" style="padding: 12px; margin-bottom: 15px; border: 2px solid #e0e0e0; border-radius: 6px;">
                    <option value="success">✅ Success (tests passed)</option>
                    <option value="failed">❌ Failed</option>
                    <option value="timeout">⏱️ Timeout</option>
                </select>

                <label>Error Message (for failed TEST_RUN):</label>
                <input type="text" id="errorMessage" placeholder="e.g., Expected [0,1] but got [1,2]" />

                <h4 style="margin: 20px 0 10px 0; color: #667eea;">5 Event Types (Simplified Architecture):</h4>
                <div class="button-group">
                    <button onclick="sendEvent('CODE_CHANGE')" title="Significant code changes (3+ lines)">📝 Code Change</button>
                    <button onclick="sendEvent('TAB_SWITCH')" title="User switched away/back to tab">🔄 Tab Switch</button>
                    <button onclick="sendEvent('HINT_REQUEST')" title="User clicked 'Get Hint'">💡 Request Hint</button>
                    <button onclick="sendEvent('TEST_RUN')" title="User ran tests">🧪 Test Run</button>
                    <button onclick="sendEvent('GIVE_UP')" title="User wants full solution">🏳️ Give Up</button>
                </div>
            </div>

            <div id="hintContainer"></div>

            <div class="section">
                <h3>📋 Event Log</h3>
                <div id="log" class="log">
                    <div class="log-entry info">System ready. Click Connect to start.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            if (connected) {
                statusDiv.innerHTML = '<span>✅</span><span>Connected</span>';
                statusDiv.className = 'status connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusDiv.innerHTML = '<span>❌</span><span>Disconnected</span>';
                statusDiv.className = 'status disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            log(`Connecting to ${url}...`, 'info');
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = () => {
                    log('WebSocket connected successfully!', 'success');
                    updateStatus(true);
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    log(`Received: ${data.type}`, 'info');
                    
                    if (data.type === 'hint') {
                        displayHint(data.hint, data.timestamp);
                    } else if (data.type === 'ack') {
                        log(data.message, 'success');
                    } else if (data.type === 'error') {
                        log(`Error: ${data.message}`, 'error');
                    }
                };
                
                ws.onerror = (error) => {
                    log('WebSocket error occurred', 'error');
                    console.error(error);
                };
                
                ws.onclose = () => {
                    log('WebSocket disconnected', 'warning');
                    updateStatus(false);
                    ws = null;
                };
            } catch (error) {
                log(`Connection error: ${error.message}`, 'error');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                log('Disconnecting...', 'info');
            }
        }

        function sendEvent(eventType) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first!');
                return;
            }

            const problemTitle = document.getElementById('problemTitle').value;
            const problemDescription = document.getElementById('problemDescription').value;
            const code = document.getElementById('code').value;
            const testStatus = document.getElementById('testStatus').value;
            const errorMsg = document.getElementById('errorMessage').value;

            // Base event structure (all events have these)
            const event = {
                event_type: eventType,
                timestamp: new Date().toISOString(),
                problem_title: problemTitle,
                problem_description: problemDescription
            };

            // Add event-specific fields based on the 5 event types
            switch(eventType) {
                case 'CODE_CHANGE':
                    // Pattern-processor checks for 3+ line changes
                    event.code = code;
                    log('Sending CODE_CHANGE - Pattern-processor will check for significant changes', 'info');
                    break;

                case 'TAB_SWITCH':
                    // Sent when user switches tabs
                    // Pattern-processor makes direct HTTP call to hint-generator
                    log('Sending TAB_SWITCH - Will trigger encouragement via HTTP', 'info');
                    break;

                case 'HINT_REQUEST':
                    // User explicitly clicked "Get Hint"
                    // Pattern-processor sends last 5 iterations to hint-generator
                    log('Sending HINT_REQUEST - Will analyze last 5 iterations', 'info');
                    break;

                case 'TEST_RUN':
                    // User ran tests locally
                    event.code = code;
                    event.test_status = testStatus;
                    event.error_message = testStatus === 'failed' ? (errorMsg || 'Test failed') : '';
                    log(`Sending TEST_RUN with status: ${testStatus}`, 'info');
                    break;

                case 'GIVE_UP':
                    // User wants full solution with 3 approaches
                    log('Sending GIVE_UP - Will receive brute force, good, and best solutions', 'info');
                    break;

                default:
                    log(`Unknown event type: ${eventType}`, 'error');
                    return;
            }

            ws.send(JSON.stringify(event));
            log(`Sent: ${eventType} event`, 'success');
            console.log('Event payload:', event);
        }

        function displayHint(hintText, timestamp) {
            const container = document.getElementById('hintContainer');
            
            const hintDiv = document.createElement('div');
            hintDiv.className = 'hint';
            hintDiv.innerHTML = `
                <h3>💡 AI Hint Received</h3>
                <p>${hintText}</p>
                <small>Received at ${new Date(timestamp).toLocaleTimeString()}</small>
            `;
            
            // Clear previous hints
            container.innerHTML = '';
            container.appendChild(hintDiv);
            
            log('Hint displayed to user', 'success');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                sendEvent('TEST_RUN');
            }
        });
    </script>
</body>
</html>
