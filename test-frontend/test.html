<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Mentor - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .content {
            padding: 30px;
        }
        .status {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .connected {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .section {
            margin-bottom: 30px;
        }
        .section h3 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            font-family: 'Courier New', monospace;
            min-height: 150px;
            resize: vertical;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
            min-width: 150px;
        }
        button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        button.secondary {
            background: #6c757d;
        }
        button.secondary:hover:not(:disabled) {
            background: #5a6268;
        }
        button.success {
            background: #28a745;
        }
        button.success:hover:not(:disabled) {
            background: #218838;
        }
        .hint {
            background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%);
            border-left: 4px solid #ffc107;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .hint h3 {
            color: #856404;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hint p {
            color: #533f03;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .hint small {
            color: #856404;
            font-size: 12px;
        }
        .log {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
            word-wrap: break-word;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry.info { color: #0066cc; }
        .log-entry.success { color: #28a745; }
        .log-entry.error { color: #dc3545; }
        .log-entry.warning { color: #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 LeetCode AI Mentor</h1>
            <p>Minimal Test Interface</p>
        </div>

        <div class="content">
            <div id="status" class="status disconnected">
                <span>❌</span>
                <span>Disconnected</span>
            </div>

            <div class="section">
                <h3>🔌 Connection</h3>
                <label>WebSocket URL:</label>
                <input type="text" id="wsUrl" value="ws://localhost:8000/ws/test-session-123" />
                
                <div class="button-group">
                    <button id="connectBtn" class="success" onclick="connect()">Connect</button>
                    <button id="disconnectBtn" class="secondary" onclick="disconnect()" disabled>Disconnect</button>
                </div>
            </div>

            <div class="section">
                <h3>📝 Test Event</h3>
                
                <label>Problem Title:</label>
                <input type="text" id="problemTitle" value="Two Sum" />
                
                <label>Your Code:</label>
                <textarea id="code">def twoSum(nums, target):
    for i in range(len(nums)):
        for j in range(i+1, len(nums)):
            if nums[i] + nums[j] == target:
                return [i, j]
    return None</textarea>
                
                <label>Error Message (optional):</label>
                <input type="text" id="errorMessage" placeholder="e.g., KeyError: 4" />
                
                <div class="button-group">
                    <button onclick="sendCodeChange()">Send Code Change</button>
                    <button onclick="sendTestResult()">Send Test Result</button>
                </div>
            </div>

            <div id="hintContainer"></div>

            <div class="section">
                <h3>📋 Event Log</h3>
                <div id="log" class="log">
                    <div class="log-entry info">System ready. Click Connect to start.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            if (connected) {
                statusDiv.innerHTML = '<span>✅</span><span>Connected</span>';
                statusDiv.className = 'status connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusDiv.innerHTML = '<span>❌</span><span>Disconnected</span>';
                statusDiv.className = 'status disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            log(`Connecting to ${url}...`, 'info');
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = () => {
                    log('WebSocket connected successfully!', 'success');
                    updateStatus(true);
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    log(`Received: ${data.type}`, 'info');
                    
                    if (data.type === 'hint') {
                        displayHint(data.hint, data.timestamp);
                    } else if (data.type === 'ack') {
                        log(data.message, 'success');
                    } else if (data.type === 'error') {
                        log(`Error: ${data.message}`, 'error');
                    }
                };
                
                ws.onerror = (error) => {
                    log('WebSocket error occurred', 'error');
                    console.error(error);
                };
                
                ws.onclose = () => {
                    log('WebSocket disconnected', 'warning');
                    updateStatus(false);
                    ws = null;
                };
            } catch (error) {
                log(`Connection error: ${error.message}`, 'error');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                log('Disconnecting...', 'info');
            }
        }

        function sendCodeChange() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first!');
                return;
            }

            const event = {
                event_type: 'code_change',
                timestamp: new Date().toISOString(),
                problem_title: document.getElementById('problemTitle').value,
                code: document.getElementById('code').value
            };

            ws.send(JSON.stringify(event));
            log('Sent: code_change event', 'success');
        }

        function sendTestResult() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first!');
                return;
            }

            const errorMsg = document.getElementById('errorMessage').value;
            const isPassed = !errorMsg;

            const event = {
                event_type: 'test_result',
                timestamp: new Date().toISOString(),
                problem_title: document.getElementById('problemTitle').value,
                code: document.getElementById('code').value,
                error_message: errorMsg || null,
                status: isPassed ? 'passed' : 'failed',
                is_correct: isPassed,  // Add is_correct field
                test_status: isPassed ? 'passed' : 'failed'  // Add test_status field
            };

            ws.send(JSON.stringify(event));
            log(`Sent: test_result event (${isPassed ? 'PASSED' : 'FAILED'})`, 'success');
        }

        function displayHint(hintText, timestamp) {
            const container = document.getElementById('hintContainer');
            
            const hintDiv = document.createElement('div');
            hintDiv.className = 'hint';
            hintDiv.innerHTML = `
                <h3>💡 AI Hint Received</h3>
                <p>${hintText}</p>
                <small>Received at ${new Date(timestamp).toLocaleTimeString()}</small>
            `;
            
            // Clear previous hints
            container.innerHTML = '';
            container.appendChild(hintDiv);
            
            log('Hint displayed to user', 'success');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                sendTestResult();
            }
        });
    </script>
</body>
</html>
