name: release-frontend-zip
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (production)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Package ZIPs
        run: |
          cd dist
          zip -r ../leetcode-mentor-${GITHUB_REF_NAME}.zip .
          zip -r ../leetcode-mentor-latest.zip .

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Gemini LeetCode Mentor ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            frontend/leetcode-mentor-${{ github.ref_name }}.zip
            frontend/leetcode-mentor-latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
