name: Publish Docker images to GHCR

on:
  push:
    branches: ["dev"]
    paths:
      - ".github/workflows/publish-images.yml"
      - "backend/shared/**"
      - "backend/requirements.txt"
      - "backend/services/api-gateway/**"
      - "backend/services/chat-service/**"
      - "backend/services/hint-generator/**"
      - "backend/services/pattern-processor/**"
      - "vertex-chat/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: devansh-ops

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: leetcode-mentor-chat-service
            dockerfile: services/chat-service/Dockerfile
            context: ./backend
          - image: leetcode-mentor-hint-generator
            dockerfile: services/hint-generator/normal-pool/Dockerfile
            context: ./backend
          - image: leetcode-mentor-pattern-processor
            dockerfile: services/pattern-processor/Dockerfile
            context: ./backend
          - image: leetcode-mentor-api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-vertex-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vertex-chat
        uses: docker/build-push-action@v6
        with:
          context: ./vertex-chat
          file: ./vertex-chat/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/leetcode-mentor-vertex-chat:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/leetcode-mentor-vertex-chat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
