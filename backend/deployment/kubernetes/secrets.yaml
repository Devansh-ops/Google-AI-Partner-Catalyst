apiVersion: v1
kind: Secret
metadata:
  name: kafka-secrets
type: Opaque
stringData:
  bootstrap-servers: "YOUR_BOOTSTRAP_SERVERS"
  api-key: "YOUR_API_KEY"
  api-secret: "YOUR_API_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: gcp-secrets
type: Opaque
stringData:
  project-id: "YOUR_PROJECT_ID"
  location: "us-central1"
---
apiVersion: v1
kind: Secret
metadata:
  name: vertex-ai-key
type: Opaque
data:
  # Base64 encode your vertex-ai-key.json content
  # cat vertex-ai-key.json | base64
  key.json: <BASE64_ENCODED_SERVICE_ACCOUNT_KEY>