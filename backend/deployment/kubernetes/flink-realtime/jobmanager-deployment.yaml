apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      containers:
      - name: jobmanager
        image: gcr.io/YOUR_PROJECT_ID/flink-pattern-detector:latest
        args: ["jobmanager"]
        ports:
        - containerPort: 6123
          name: rpc
        - containerPort: 6124
          name: blob
        - containerPort: 8081
          name: ui
        - containerPort: 9249
          name: metrics
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            secretKeyRef:
              name: kafka-secrets
              key: bootstrap-servers
        - name: KAFKA_API_KEY
          valueFrom:
            secretKeyRef:
              name: kafka-secrets
              key: api-key
        - name: KAFKA_API_SECRET
          valueFrom:
            secretKeyRef:
              name: kafka-secrets
              key: api-secret
        - name: FLINK_CHECKPOINT_DIR
          value: "gs://your-gcs-bucket/flink-checkpoints"
        volumeMounts:
        - name: flink-config
          mountPath: /opt/flink/conf/flink-conf.yaml
          subPath: flink-conf.yaml
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: flink-config
        configMap:
          name: flink-realtime-config
