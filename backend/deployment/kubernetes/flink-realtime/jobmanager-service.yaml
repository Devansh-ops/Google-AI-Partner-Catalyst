apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: default
spec:
  type: ClusterIP
  ports:
  - name: rpc
    port: 6123
    targetPort: 6123
  - name: blob
    port: 6124
    targetPort: 6124
  - name: ui
    port: 8081
    targetPort: 8081
  - name: metrics
    port: 9249
    targetPort: 9249
  selector:
    app: flink
    component: jobmanager
