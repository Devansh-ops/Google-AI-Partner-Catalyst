apiVersion: apps/v1
kind: Deployment
metadata:
  name: hint-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hint-generator
  template:
    metadata:
      labels:
        app: hint-generator
    spec:
      containers:
      - name: hint-generator
        image: gcr.io/YOUR_PROJECT_ID/leetcode-mentor-hint-generator:latest
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            secretKeyRef:
              name: kafka-secrets
              key: bootstrap-servers
        - name: KAFKA_API_KEY
          valueFrom:
            secretKeyRef:
              name: kafka-secrets
              key: api-key
        - name: KAFKA_API_SECRET
          valueFrom:
            secretKeyRef:
              name: kafka-secrets
              key: api-secret
        - name: GOOGLE_CLOUD_PROJECT
          valueFrom:
            secretKeyRef:
              name: gcp-secrets
              key: project-id
        - name: VERTEX_AI_LOCATION
          valueFrom:
            secretKeyRef:
              name: gcp-secrets
              key: location
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app/vertex-ai-key.json
        volumeMounts:
        - name: gcp-key
          mountPath: /app/vertex-ai-key.json
          subPath: key.json
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: gcp-key
        secret:
          secretName: vertex-ai-key