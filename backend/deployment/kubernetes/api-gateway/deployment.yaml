apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: gcr.io/YOUR_PROJECT_ID/leetcode-mentor-api-gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            secretKeyRef:
              name: kafka-secrets
              key: bootstrap-servers
        - name: KAFKA_API_KEY
          valueFrom:
            secretKeyRef:
              name: kafka-secrets
              key: api-key
        - name: KAFKA_API_SECRET
          valueFrom:
            secretKeyRef:
              name: kafka-secrets
              key: api-secret
        - name: GOOGLE_CLOUD_PROJECT
          valueFrom:
            secretKeyRef:
              name: gcp-secrets
              key: project-id
        - name: VERTEX_AI_LOCATION
          valueFrom:
            secretKeyRef:
              name: gcp-secrets
              key: location
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app/vertex-ai-key.json
        - name: PORT
          value: "8000"
        - name: HOST
          value: "0.0.0.0"
        volumeMounts:
        - name: gcp-key
          mountPath: /app/vertex-ai-key.json
          subPath: key.json
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: gcp-key
        secret:
          secretName: vertex-ai-key