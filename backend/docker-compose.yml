version: '3.8'

services:
  api-gateway:
    container_name: leetcodementor_server
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./vertex-ai-key.json:/app/vertex-ai-key.json
    restart: unless-stopped
    networks:
      - leetcode-mentor
      - caddy_shared_net

  hint-generator:
    build:
      context: .
      dockerfile: services/hint-generator/normal-pool/Dockerfile
    env_file:
      - .env
    volumes:
      - ./vertex-ai-key.json:/app/vertex-ai-key.json
    restart: unless-stopped
    depends_on:
      - api-gateway
    networks:
      - leetcode-mentor

  pattern-processor:
    build:
      context: .
      dockerfile: services/pattern-processor/Dockerfile
    env_file:
      - .env
    volumes:
      - ./vertex-ai-key.json:/app/vertex-ai-key.json
      - pattern-processor-state:/app/state
    restart: unless-stopped
    depends_on:
      - api-gateway
    networks:
      - leetcode-mentor

volumes:
  pattern-processor-state:
    driver: local

networks:
  leetcode-mentor:
    driver: bridge
  caddy_shared_net:
    external: true